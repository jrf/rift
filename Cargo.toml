[package]
name = "rift"
version = "0.1.0"
edition = "2024"
description = "A terminal session daemon — like tmux, screen, or abduco, but simpler."
authors = ["Jeffrey Fetzer <jrf@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jrf/rift"
homepage = "https://github.com/jrf/rift"
keywords = ["tmux", "terminal", "session", "pty", "multiplexer"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
base64 = "0.22"
libc = "0.2.183"
log = "0.4.29"
nix = { version = "0.31.2", features = ["poll", "signal", "term", "fs", "net", "process"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "signal", "io-util", "macros", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
vte = "0.15"
alacritty_terminal = "0.26.0"

# Optimized release binaries for distribution: strip symbols, LTO, and
# single-codegen-unit builds so downloaded artifacts stay small and fast.
[profile.release]
strip = true
lto = true
codegen-units = 1
